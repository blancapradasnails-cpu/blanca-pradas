<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blanca Pradas · Reserva tu cita</title>
<meta name="description" content="Reserva tu cita en Blanca Pradas, estudio de uñas.">
<meta name="theme-color" content="#6A3FA0">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>/* El panel tiene su propio acceso directo: al añadirlo a la pantalla de inicio abre el panel, no las reservas. */
(function(){var p=/[?&]panel=/.test(location.search);
document.write('<link rel="manifest" href="'+(p?'manifest-panel.webmanifest':'manifest.webmanifest')+'"><meta name="apple-mobile-web-app-title" content="'+(p?'Panel Blanca':'Blanca Pradas')+'">')})();</script>
<meta property="og:title" content="Blanca Pradas · Estudio de uñas">
<meta property="og:description" content="Reserva tu cita online.">
<meta property="og:image" content="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Web de reservas: columna estrecha tipo móvil. Panel: menú lateral que pasa a pestañas en el móvil. El color de marca sale de Config. */
:root{
  --brand:#6A3FA0; --brand2:#DCC6F7;
  --bg:color-mix(in srgb,var(--brand2) 20%,#FFFFFF); --surface:#FFFFFF; --surface-2:color-mix(in srgb,var(--brand2) 36%,#FFFFFF); --fg:#251B30; --muted:#685A76; --line:color-mix(in srgb,var(--brand) 17%,#FFFFFF);
  --accent:var(--brand); --accent-ink:#FFFFFF;
  --accent-soft:color-mix(in srgb,var(--brand2) 42%,var(--surface));
  --ok:#1C7A4C; --ok-soft:#E3F3EA; --bad:#B42318; --bad-soft:#FBE6E3; --warn:#9A6400; --warn-soft:#FBF0D9;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-modo="claro"]){
  --bg:#15101C; --surface:#1E1727; --surface-2:#2A2135; --fg:#F4EEFA; --muted:#BCAECB; --line:#3B3049;
  --accent:var(--brand2); --accent-ink:#22143A; --accent-soft:color-mix(in srgb,var(--brand) 34%,var(--surface));
  --ok:#5BC994; --ok-soft:#183126; --bad:#F2958B; --bad-soft:#3A1D1A; --warn:#E8B657; --warn-soft:#352812; color-scheme:dark}}
:root[data-modo="oscuro"]{
  --bg:#15101C; --surface:#1E1727; --surface-2:#2A2135; --fg:#F4EEFA; --muted:#BCAECB; --line:#3B3049;
  --accent:var(--brand2); --accent-ink:#22143A; --accent-soft:color-mix(in srgb,var(--brand) 34%,var(--surface));
  --ok:#5BC994; --ok-soft:#183126; --bad:#F2958B; --bad-soft:#3A1D1A; --warn:#E8B657; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:0;text-wrap:balance;margin:0;line-height:1.1;font-size-adjust:.52}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.c-head.con-logo{flex-direction:column;text-align:center;gap:4px}
.logo-img{width:min(270px,78%);height:auto;display:block;margin:0 auto;border-radius:18px;background:#fff}
img.c-logo{object-fit:cover;padding:0}
.modo-sel{display:grid;gap:6px;padding:6px 12px}
.modo-sel .seg button{padding:6px 10px}
.marca{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.prev-logo{width:200px;max-width:100%;border-radius:12px;background:#fff;border:1px solid var(--line)}
.prev-icono{width:76px;height:76px;border-radius:18px;object-fit:cover;border:1px solid var(--line)}
.combo i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:3px;vertical-align:-2px;border:1px solid rgb(0 0 0/.15)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg [aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-sm{padding:5px 10px;font-size:13px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.field{display:grid;gap:5px}
.field>span{font-size:13px;font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--bad);font-size:14px;font-weight:600;margin:0}
.nota{font-size:13px;color:var(--muted);margin:0}
.cargando{color:var(--muted);font-size:14px;padding:12px 0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.e-confirmada{background:var(--ok-soft);color:var(--ok)}
.e-completada{background:var(--surface-2);color:var(--muted)}
.e-pendiente{background:var(--warn-soft);color:var(--warn)}
.e-noVino{background:var(--bad-soft);color:var(--bad)}
.e-cancelCliente,.e-cancelNegocio{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.datos{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.datos dt{color:var(--muted)}
.datos dd{margin:0;font-weight:600}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copiar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copiar code{font-size:13px;background:var(--surface-2);padding:6px 10px;border-radius:6px;word-break:break-all;user-select:all;min-width:0}

/* ===== Web de reservas ===== */
.c-wrap{max-width:460px;margin:0 auto;display:grid;gap:18px}
.c-head{display:flex;gap:14px;align-items:center}
.c-logo{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 24px var(--f-display);flex:none}
.c-head h1{font-size:26px}
.c-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.c-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;list-style:none;margin:0;padding:0}
.c-steps li{font-size:12px;font-weight:600;color:var(--muted);padding-top:8px;border-top:3px solid var(--line)}
.c-steps li.hecho{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.c-steps li[aria-current="step"]{border-color:var(--accent);color:var(--fg)}
.c-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.c-card h2{font-size:20px}
.cat{display:grid;gap:8px}
.svc-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vista-svc{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2);flex:none}
.vista-svc button{border:0;background:transparent;color:var(--muted);width:36px;height:32px;border-radius:999px;display:grid;place-items:center;cursor:pointer}
.vista-svc button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.svc-cuadricula .cat{grid-template-columns:repeat(2,minmax(0,1fr))}
.svc-cuadricula .cat>.lbl{grid-column:1/-1}
.svc-cuadricula .svc,.svc-cuadricula .svc.con-foto{grid-template-columns:minmax(0,1fr);gap:4px;height:100%;align-content:start}
.svc-cuadricula .svc-p,.svc-cuadricula .svc-m{text-align:left}
.svc-cuadricula .svc-d{display:none}
.svc-cuadricula .svc-th{grid-row:auto;grid-column:auto;order:-1;width:100%;height:auto;aspect-ratio:4/3;margin-bottom:4px}
.svc-cuadricula .svc-card{align-content:space-between}
.svc-cuadricula .svc-det{padding:0 12px 12px}
.svc{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.svc:hover{border-color:var(--accent);background:var(--accent-soft)}
.svc-n{font-weight:600}
.svc-p{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.svc-d{font-size:13px;color:var(--muted)}
.svc-m{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.svc-card{display:grid;gap:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.svc-card .svc{border:0;border-radius:0;background:transparent}
.svc.con-foto{grid-template-columns:1fr auto 64px}
.svc-th{grid-row:1/3;grid-column:3;width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.svc-det{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 14px 12px}
.svc-det .btn-det{font:inherit;font-size:13px;font-weight:600;color:var(--brand);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.svc-det img{width:100%;max-height:340px;object-fit:cover;border-radius:12px;background:var(--surface-2)}
.svc-det p{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap;border-left:3px solid var(--line);padding-left:10px}
.f-svc{display:flex;align-items:center;gap:6px;white-space:nowrap}
.f-svc img{width:40px;height:40px;border-radius:8px;object-fit:cover}
textarea.in{min-height:56px;resize:vertical;font:inherit}
.btn-enl{justify-self:center;font:inherit;font-weight:600;color:var(--brand);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer}
.enl-modal{max-width:520px}
.enl-b{gap:12px}
.enl{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);text-decoration:none}
.enl svg{color:var(--brand);flex:none}
.enl span{display:grid;gap:2px;min-width:0}
.enl small{color:var(--muted);font-size:13px}
.promo{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;display:grid}
.promo img{width:100%;max-height:320px;object-fit:cover}
.promo>div{padding:12px 14px;display:grid;gap:8px;justify-items:start}
.promo p{margin:0;white-space:pre-wrap;color:var(--muted);font-size:14px}
.sw-dur{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.sw-dur input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw-dur input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .15s}
.sw-dur input:checked{background:var(--brand)}
.sw-dur input:checked::after{transform:translateX(20px)}
.sw-dur input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.resumen{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}
.resumen b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.dia{flex:none;width:58px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 0;display:grid;justify-items:center;gap:1px}
.dia small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dia b{font:650 20px var(--f-display);font-variant-numeric:tabular-nums}
.dia[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dia[aria-pressed="true"] small{color:inherit}
.dia:disabled{opacity:.38;background:var(--surface-2)}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.hora{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-weight:600;font-variant-numeric:tabular-nums}
.hora:hover{border-color:var(--accent);background:var(--accent-soft)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.consent input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.info{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.codigo-big{font:700 30px var(--f-display);letter-spacing:.12em;font-variant-numeric:tabular-nums;background:var(--accent-soft);border-radius:10px;padding:8px 16px;display:inline-block}
.mia{display:grid;gap:8px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft)}
.mia b{font-weight:650}
.trampa{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
.ok-badge{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}

/* ===== Panel ===== */
.login{max-width:380px;margin:30px auto;display:grid;gap:16px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
.login-logo{display:block;width:140px;height:140px;margin:0 auto 4px;border-radius:24px;box-shadow:0 2px 10px rgb(0 0 0/.08)}
/* Fondo del panel: el logo del negocio como marca de agua */
body.es-panel::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(fondo-panel.png) center 55%/min(900px,92vw) auto no-repeat;opacity:.32}
body.es-panel .p-main{--surface:rgb(255 255 255/.6);--surface-2:color-mix(in srgb,var(--brand2) 30%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-modo="claro"]) body.es-panel::before{filter:invert(1) hue-rotate(180deg);opacity:.28}}
:root[data-modo="oscuro"] body.es-panel::before{filter:invert(1) hue-rotate(180deg);opacity:.28}
@media (prefers-color-scheme:dark){:root:not([data-modo="claro"]) body.es-panel .p-main{--surface:rgb(30 23 39/.66);--surface-2:rgb(42 33 53/.66)}}
:root[data-modo="oscuro"] body.es-panel .p-main{--surface:rgb(30 23 39/.66);--surface-2:rgb(42 33 53/.66)}
.p-shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.p-nav{position:sticky;top:0;display:grid;gap:2px;padding-top:4px}
.p-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.p-brand .c-logo{width:34px;height:34px;font-size:16px}
.p-brand b{font:650 16px var(--f-display)}
.p-nav button.nav{border:0;background:none;text-align:left;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.p-nav button.nav:hover{background:var(--surface-2);color:var(--fg)}
.p-nav button.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:650}
.p-nav .sep{height:1px;background:var(--line);margin:8px 0}
.p-main{min-width:0;display:grid;gap:18px}
.p-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.p-top h1{font-size:28px}
.p-top p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat b{display:block;font:650 22px var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.cal-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cal-bar h2{font-size:20px;margin-right:auto;min-width:0}
.arrows{display:inline-flex;gap:4px}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px}
.tg-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tg{min-width:calc(56px + var(--cols) * 104px)}
.tg-head,.tg-body{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(104px,1fr))}
.tg-head{border-bottom:1px solid var(--line);background:var(--surface)}
.tg-h{border:0;border-left:1px solid var(--line);background:none;padding:8px 6px;font-size:13px;font-weight:600;text-align:center;color:var(--muted)}
.tg-h.is-hoy,.tg-h.is-hoy b{color:var(--accent)}
.tg-h b{display:block;font:650 18px var(--f-display);color:var(--fg)}
.tg-horas,.tg-col{position:relative}
.tg-hora{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tg-hora:first-child{transform:none}
.tg-col{border-left:1px solid var(--line);background:var(--surface-2);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh))}
.tg-open{position:absolute;left:0;right:0;background:var(--surface);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh));background-position:0 var(--off)}
.tg-bloq{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 18%,transparent) 0 6px,transparent 6px 12px);font-size:11px;color:var(--muted);padding:3px 6px;overflow:hidden}
.ev{position:absolute;border:0;text-align:left;padding:3px 6px;border-radius:6px;background:color-mix(in srgb,var(--pc) 20%,var(--surface));color:var(--fg);font-size:12px;line-height:1.25;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 45%,transparent)}
.ev:hover{background:color-mix(in srgb,var(--pc) 32%,var(--surface))}
.ev span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.pend{background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--pc) 14%,transparent) 5px 10px)}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.mes .dn{background:var(--surface);padding:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.mc{background:var(--surface);min-height:96px;padding:5px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;min-width:0}
.mc:hover{background:var(--accent-soft)}
.mc.fuera,.mc.cerrado{background:var(--surface-2);color:var(--muted)}
.mc.festivo{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 14%,var(--surface)) 0 6px,var(--surface) 6px 12px)}
.mc .d{font-weight:650;font-size:13px;font-variant-numeric:tabular-nums}
.mc.is-hoy .d{color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 7px;align-self:flex-start}
.mc .ch{font-size:11px;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--pc) 18%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<body>
<div id="app"><p class="cargando">Cargando…</p></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ---------- utilidades ---------- */
// Página propia del negocio. Los datos se leen y guardan en la hoja a través de la app de Google (API).
const API='https://script.google.com/macros/s/AKfycbz50bkb6-8HKVZVC0rDxRDzShHHRzYBmFsBu6GmEo-xQLB4cHLUJUynbrNiz9V7nH03/exec';
const QS=new URLSearchParams(location.search);
const MODO=QS.has('panel')?'panel':(QS.get('c')?'cancelar':'reservar'),CODIGO=(QS.get('c')||'').replace(/[^A-Za-z0-9]/g,'').slice(0,20);
const WEB=location.origin+location.pathname.replace(/index\.html$/,'');
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{if(!s)return null;const[h,m]=String(s).split(':').map(Number);return h*60+(m||0)};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const hoy=()=>ymd(new Date());
const ahoraHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fLarga=s=>{const d=parse(s);return DIAS[d.getDay()].toLowerCase()+' '+d.getDate()+' de '+MESES[d.getMonth()]};
const fCorta=s=>{if(!s)return'—';const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const tel=t=>String(t||'').replace(/\D/g,'');
const eur=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Mismo criterio que el servidor: el significado del estado sale de sus palabras, así se pueden renombrar en Listas.
const tipoE=e=>{e=String(e||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(/cancel|anul/.test(e))return /client/.test(e)?'cancelCliente':'cancelNegocio';
  if(/no vino|no asist|no se present|falt/.test(e))return 'noVino';
  if(/complet|realiz|hech|termin|atendid/.test(e))return 'completada';
  if(/pendient|por confirmar|sin confirmar/.test(e))return 'pendiente';
  return 'confirmada'};
const nombreE=t=>((typeof S!=='undefined'&&S&&S.estados)||[]).find(e=>tipoE(e)===t)||{pendiente:'Pendiente',confirmada:'Confirmada',completada:'Completada',cancelCliente:'Cancelada por el cliente',cancelNegocio:'Anulada por el negocio',noVino:'No vino'}[t];
const cls=e=>'e-'+tipoE(e);
const ocupa=c=>!['cancelCliente','cancelNegocio'].includes(tipoE(c.estado));
const api=(fn,...a)=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})})
  .then(r=>{if(!r.ok)throw new Error('Sin conexión');return r.json()}).then(x=>{if(!x||!x.ok)throw new Error((x&&x.error)||'Error');return x.r});
const msgErr=e=>String((e&&e.message)||e||'Error').replace(/^Error:\s*/,'');
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function aplicarColor(){let cf={};try{cf=(MODO==='panel'?S&&S.config:INFO&&INFO.config)||{}}catch(e){}const ok=c=>/^#[0-9a-f]{6}$/i.test(c||''),r=document.documentElement;
  r.style.setProperty('--brand',ok(cf.color)?cf.color:'#6A3FA0');r.style.setProperty('--brand2',ok(cf.color2)?cf.color2:'#DCC6F7');
  let m=String(cf.modo||'').toLowerCase();if(MODO==='panel'){try{m=localStorage.getItem('citas-modo-panel')||m}catch(e){}}
  r.dataset.modo=m==='oscuro'?'oscuro':m==='claro'?'claro':'auto'}
function copiar(texto){try{navigator.clipboard.writeText(texto).then(()=>toast('Copiado'),()=>toast('Selecciona el texto y cópialo'))}catch(e){toast('Selecciona el texto y cópialo')}}
const app=document.getElementById('app');

/* =====================================================================
   WEB DE RESERVAS
   ===================================================================== */
let INFO=null;
// Servicios en lista (uno por fila, por defecto) o en cuadrícula (dos por fila); se recuerda en cada móvil.
let VISTA_SVC='lista';try{if(localStorage.getItem('vistaSvc')==='cuadricula')VISTA_SVC='cuadricula'}catch(err){}
// Duración como la quiere ver el negocio: «90 min» o «1 h 30 min» (Configuración > Duración en la web).
const fmtDur=m=>{m=Math.round(+m||0);if(!(INFO&&INFO.config&&INFO.config.formatoDur==='Horas')||m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'')};
let C={vista:VISTA_SVC,paso:1,servicio:null,prof:'',dias:null,fecha:null,horas:null,t:null,res:null,error:'',info:false,enviando:false,form:{nombre:'',telefono:'',acepto:false},cancel:null,
  mias:[],confMia:null,anular:null};
const MIAS='citas-mias';
function leerMias(){try{const l=JSON.parse(localStorage.getItem(MIAS)||'[]');return Array.isArray(l)?l:[]}catch(e){return[]}}
function guardarMias(l){try{localStorage.setItem(MIAS,JSON.stringify(l.slice(-10)))}catch(e){}}
function recordarCita(c,telefono){const l=leerMias().filter(x=>x.codigo!==c.codigo);l.push({codigo:c.codigo,telefono});guardarMias(l)}
// WhatsApp a la clienta: abre el chat con el mensaje ya escrito (sale del WhatsApp del negocio).
const waTel=t=>{let d=tel(t);if(d.startsWith('00'))d=d.slice(2);if(d.length===9)d='34'+d;return d};
function waTexto(c,modo){const cf=S.config||{},neg=cf.nombre||'el salón',nom=String(c.cliente||'').trim().split(/\s+/)[0]||'',web=cf.web||(typeof WEB!=='undefined'?WEB:''),dia=fLarga(c.fecha);
  if(modo==='anular')return`Hola ${nom}, te escribo de ${neg}. Tu cita del ${dia} a las ${c.inicio} (${c.servicio}) queda anulada. Si quieres otro día, puedes reservar en ${web} o contestar a este mensaje.`;
  return`Hola ${nom}, te confirmo tu cita en ${neg}:\n${cap(dia)} a las ${c.inicio}\n${c.servicio}${cf.direccion?'\n'+cf.direccion:''}\n\nSi necesitas anularla, entra en ${web} con tu teléfono y el código ${fmtCod(c.codigo)}.\n¡Te esperamos!`}
const waUrl=(c,modo)=>'https://wa.me/'+waTel(c.telefono)+'?text='+encodeURIComponent(waTexto(c,modo));
const fmtCod=c=>{c=String(c||'');return c.length===6&&!/^[A-Z]{1,4}\d{3}$/.test(c)?c.slice(0,3)+' '+c.slice(3):c};
async function cargarMias(){const l=leerMias();if(!l.length)return;
  try{const r=await api('publicoMisCitas',l),h=hoy();
    C.mias=r.filter(c=>ocupa(c)&&c.fecha>=h&&!['completada','noVino'].includes(tipoE(c.estado))).map(c=>Object.assign(c,{telefono:(l.find(x=>x.codigo===c.codigo)||{}).telefono}));
    guardarMias(C.mias.map(c=>({codigo:c.codigo,telefono:c.telefono})))}catch(e){}}
function enlacesCalendario(c){const cf=INFO.config,f=c.fecha.replace(/-/g,''),h=x=>x.replace(':','')+'00';
  const det='Código de tu cita: '+fmtCod(c.codigo)+'\nPara anularla entra en '+INFO.url+(cf.telefono?' o llama al '+cf.telefono:'');
  const g='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(cf.nombre+': '+c.servicio)+'&dates='+f+'T'+h(c.inicio)+'/'+f+'T'+h(c.fin)+'&ctz='+encodeURIComponent(INFO.tz||'Europe/Madrid')+'&details='+encodeURIComponent(det)+'&location='+encodeURIComponent(cf.direccion||'');
  return`<div class="acciones"><a class="btn btn-sm" href="${esc(g)}" target="_blank" rel="noopener">Añadir a Google Calendar</a><button class="btn btn-sm" data-act="cIcs" data-cod="${esc(c.codigo)}">Añadir al calendario del iPhone u otro</button></div>`}
function descargarIcs(c){const cf=INFO.config,f=c.fecha.replace(/-/g,''),h=x=>x.replace(':','')+'00',e=t=>String(t||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const tz=INFO.tz||'Europe/Madrid',ahora=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//App Citas//ES','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+c.codigo+'-'+f+'@appcitas','DTSTAMP:'+ahora,
    'DTSTART;TZID='+tz+':'+f+'T'+h(c.inicio),'DTEND;TZID='+tz+':'+f+'T'+h(c.fin),'SUMMARY:'+e(cf.nombre+': '+c.servicio),'LOCATION:'+e(cf.direccion),
    'DESCRIPTION:'+e('Código de tu cita: '+fmtCod(c.codigo)+'\nPara anularla entra en '+INFO.url+(cf.telefono?' o llama al '+cf.telefono:'')),
    'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:'+e('Cita en '+cf.nombre),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar;charset=utf-8'}));a.download='cita-'+(cf.nombre||'').replace(/\s+/g,'-')+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function tarjetaMia(c){const cf=INFO.config;
  return`<div class="mia"><span><b>${cap(fLarga(c.fecha))}</b> a las <b class="num">${c.inicio}</b></span><span>${esc(c.servicio)}${c.profesional?' · con '+esc(c.profesional):''}</span><span class="nota">Código: <b class="num">${fmtCod(c.codigo)}</b></span>
    ${C.confMia===c.codigo?`<div class="confirma"><b>¿Seguro que quieres anular esta cita?</b><div class="acciones"><button class="btn btn-bad" data-act="cMiaSi" data-cod="${esc(c.codigo)}" ${C.enviando?'disabled':''}>${C.enviando?'Anulando…':'Sí, anular'}</button><button class="btn" data-act="cMiaNo">No</button></div></div>`
    :c.puedeCancelar?`<div class="acciones"><button class="btn btn-bad btn-sm" data-act="cMia" data-cod="${esc(c.codigo)}">Anular cita</button></div>`
    :`<p class="nota">Ya no se puede anular por aquí: faltan menos de ${cf.plazoCancelar} horas. Llámanos al <b>${esc(cf.telefono)}</b>.</p>`}</div>`}
function vAnular(){const a=C.anular;
  return`<section class="c-card"><h2>Anular una cita</h2>
    ${a.cita?tarjetaMia(a.cita):`<form data-form="buscarCita" style="display:grid;gap:12px" novalidate>
      <p class="nota" style="font-size:14px">Escribe el teléfono con el que reservaste y el código de tu cita que te dimos al reservar (por ejemplo BP012).</p>
      <label class="field"><span>Teléfono</span><input class="in" id="b-tel" type="tel" inputmode="tel" autocomplete="tel" value="${esc(a.tel)}" maxlength="20"></label>
      <label class="field"><span>Código de la cita</span><input class="in" id="b-cod" value="${esc(a.cod)}" maxlength="9" autocapitalize="characters" autocomplete="off" placeholder="Ej.: BP012" style="text-transform:uppercase;letter-spacing:.1em"></label>
      ${a.error?`<p class="err" role="alert">${esc(a.error)}</p>`:''}
      <button class="btn btn-p" type="submit" ${a.buscando?'disabled':''}>${a.buscando?'Buscando…':'Buscar mi cita'}</button></form>`}
    <p class="nota">¿No encuentras el código? Llámanos al <b>${esc(INFO.config.telefono)}</b>.</p>
    <button class="link" data-act="cAnularCerrar" style="justify-self:start">Volver a reservar</button></section>`}
const svcC=id=>INFO.servicios.find(s=>s.id===id);
function vCliente(){
  const cf=INFO.config;

    <div class="stat"><span class="lbl">Faltas en ${MESES[f.getMonth()]}</span><b>${faltas}</b><span class="muted">no vinieron</span></div></div>
  <div class="cal-bar"><h2>${titulo}</h2>
    <span class="arrows"><button class="btn btn-sm" data-act="pMover" data-d="-1" aria-label="Anterior">‹</button><button class="btn btn-sm" data-act="pHoy">Hoy</button><button class="btn btn-sm" data-act="pMover" data-d="1" aria-label="Siguiente">›</button></span>
    <span class="seg">${[['dia','Día'],['semana','Semana'],['mes','Mes'],['anio','Año']].map(([k,l])=>`<button data-act="pModo" data-m="${k}" aria-current="${P.modo===k}">${l}</button>`).join('')}</span>
    <select class="sel" id="f-prof" data-ch="pProf" aria-label="Profesional"><option value="">Todas las profesionales</option>${S.profesionales.map(p=>`<option ${P.prof===p.nombre?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div>
  ${cuerpo}
  <div class="leyenda">${S.profesionales.map(p=>`<span><i style="background:color-mix(in srgb,${esc(p.color)} 35%,var(--surface))"></i>${esc(p.nombre)}</span>`).join('')}<span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Fuera de horario</span><span><i style="background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)"></i>Bloqueado</span></div>`}
function tiempo(cols){
  const[h0,h1]=rangoHoras(),H=(h1-h0)*60*PX,hh=60*PX+'px';
  const profs=activas().filter(p=>!P.prof||p.nombre===P.prof).map(p=>p.nombre);
  const y=m=>(m-h0*60)*PX;
  let horas='';for(let x=h0;x<h1;x++)horas+=`<div class="tg-hora" style="top:${y(x*60)}px">${pad(x)}:00</div>`;
  const body=cols.map(c=>{
    const ps=c.prof?[c.prof]:profs;let o='';
    ps.forEach(p=>franjas(p,c.fecha).forEach(fr=>{const t=y(toMin(fr.desde));o+=`<div class="tg-open" style="top:${t}px;height:${y(toMin(fr.hasta))-t}px;--off:${-t}px"></div>`}));
    S.bloqueos.filter(b=>b.desde&&c.fecha>=b.desde&&c.fecha<=(b.hasta||b.desde)&&(b.profesional==='Todas'||ps.includes(b.profesional))).forEach(b=>{
      const a=b.horaDesde?toMin(b.horaDesde):h0*60,z=b.horaHasta?toMin(b.horaHasta):h1*60;
      o+=`<div class="tg-bloq" style="top:${y(a)}px;height:${y(z)-y(a)}px">${esc(b.motivo)}${b.profesional!=='Todas'&&!c.prof?' ('+esc(b.profesional)+')':''}</div>`});
    const cc=S.citas.filter(x=>x.fecha===c.fecha&&ocupa(x)&&ps.includes(x.profesional));
    const cruce=cc.some(a=>cc.some(b=>a.profesional!==b.profesional&&a.inicio<b.fin&&b.inicio<a.fin));
    cc.forEach(x=>{const lane=c.prof||!cruce?0:profs.indexOf(x.profesional),nl=c.prof||!cruce?1:profs.length,t=y(toMin(x.inicio)),hg=Math.max(20,y(toMin(x.fin))-t);
      o+=`<button class="ev ${tipoE(x.estado)==='pendiente'?'pend':''}" data-act="pVer" data-id="${esc(x.id)}" style="top:${t}px;height:${hg}px;left:calc(${lane}/${nl}*100% + 2px);width:calc(100%/${nl} - 4px);--pc:${esc(pColor(x.profesional))}"><b>${x.inicio}</b> ${esc(x.cliente)}<span>${esc(x.servicio)}</span></button>`});
    return`<div class="tg-col" style="height:${H}px;--hh:${hh}">${o}</div>`}).join('');
  return`<div class="tg-scroll"><div class="tg" style="--cols:${cols.length}"><div class="tg-head"><div></div>${cols.map(c=>c.head).join('')}</div><div class="tg-body"><div class="tg-horas" style="height:${H}px">${horas}</div>${body}</div></div></div>`}
function calSemana(){const a=lunes(parse(P.fecha));
  return tiempo([...Array(7)].map((_,i)=>{const d=addDays(a,i),f=ymd(d);return{fecha:f,head:`<button class="tg-h ${f===hoy()?'is-hoy':''}" data-act="pIrDia" data-f="${f}">${DIAS[d.getDay()].slice(0,3)}<b>${d.getDate()}</b></button>`}}))}
function calDia(){const ps=activas().filter(p=>!P.prof||p.nombre===P.prof);
  if(!ps.length)return'<p class="vacio">No hay profesionales activas.</p>';
  return tiempo(ps.map(p=>({fecha:P.fecha,prof:p.nombre,head:`<div class="tg-h"><b style="font-size:15px">${esc(p.nombre)}</b>${franjas(p.nombre,P.fecha).map(f=>f.desde+'–'+f.hasta).join(' · ')||'No trabaja'}</div>`})))}
function calMes(){
  const f=parse(P.fecha),ini=lunes(new Date(f.getFullYear(),f.getMonth(),1));
  let h=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dn">${d}</div>`).join('');
  for(let i=0;i<42;i++){const d=addDays(ini,i),k=ymd(d);if(i===35&&d.getMonth()!==f.getMonth())break;
    const cs=citasDia(k),fe=festivo(k),fuera=d.getMonth()!==f.getMonth();
    h+=`<button class="mc ${fuera?'fuera':''} ${diaCerrado(k)?'cerrado':''} ${fe?'festivo':''} ${k===hoy()?'is-hoy':''}" data-act="pIrDia" data-f="${k}" aria-label="${fLarga(k)}, ${cs.length} citas"><span class="d">${d.getDate()}</span>${fe?`<span class="mot">${esc(fe.motivo)}</span>`:''}${cs.slice(0,3).map(c=>`<span class="ch" style="--pc:${esc(pColor(c.profesional))}">${c.inicio} ${esc(c.cliente)}</span>`).join('')}${cs.length>3?`<span class="mas">y ${cs.length-3} más</span>`:''}${cs.length?`<span class="cnt">${cs.length}</span>`:''}</button>`}
  return`<div class="mes">${h}</div>`}
function calAnio(){
  const y=parse(P.fecha).getFullYear();let h='';
  for(let m=0;m<12;m++){const ini=new Date(y,m,1),off=(ini.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
    let g=['L','M','X','J','V','S','D'].map(d=>`<span>${d}</span>`).join('')+'<span></span>'.repeat(off);
    for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d)),c=citasDia(k).length,fe=festivo(k);
      g+=`<button class="md ${diaCerrado(k)?'cerrado':''} ${fe?'festivo':''} ${k===hoy()?'is-hoy':''}" data-l="${c>=4?3:c>=2?2:c?1:0}" data-act="pIrDia" data-f="${k}" title="${fLarga(k)}: ${fe?esc(fe.motivo):c+' citas'}">${d}</button>`}
    h+=`<div class="mini"><h3><button data-act="pIrMes" data-f="${ymd(ini)}">${MESES[m]}</button></h3><div class="mini-g">${g}</div></div>`}
  return`<div class="anio">${h}</div><div class="leyenda"><span><i style="background:color-mix(in srgb,var(--accent) 22%,var(--surface))"></i>1 cita</span><span><i style="background:color-mix(in srgb,var(--accent) 45%,var(--surface))"></i>2–3</span><span><i style="background:var(--accent)"></i>4 o más</span><span><i style="background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)"></i>Festivo</span></div>`}

/* ---------- clientes y ficha ---------- */
function resumenCliente(t){
  const cs=S.citas.filter(c=>tel(c.telefono)===t).sort((a,b)=>(a.fecha+a.inicio).localeCompare(b.fecha+b.inicio));
  const h=hoy(),hm=ahoraHM(),pasada=c=>c.fecha<h||(c.fecha===h&&c.fin<=hm);
  const pasadas=cs.filter(pasada),futuras=cs.filter(c=>!pasada(c));
  const hechas=pasadas.filter(c=>['completada','confirmada'].includes(tipoE(c.estado)));
  const prox=futuras.filter(ocupa);
  return{cs,pasadas,futuras,hechas,prox,ultima:hechas[hechas.length-1],siguiente:prox[0],
    gastado:hechas.reduce((s,c)=>s+precioCita(c),0),
    canceladas:cs.filter(c=>tipoE(c.estado)==='cancelCliente').length,
    anuladas:cs.filter(c=>tipoE(c.estado)==='cancelNegocio').length,
    faltas:cs.filter(c=>tipoE(c.estado)==='noVino').length,
    favorito:(()=>{const m={};hechas.forEach(c=>m[c.servicio]=(m[c.servicio]||0)+1);const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:''})()}}
function vClientes(){
  const q=P.cq.trim().toLowerCase();

    .sort((a,b)=>((b.r.ultima||{}).fecha||'').localeCompare((a.r.ultima||{}).fecha||'')||a.c.nombre.localeCompare(b.c.nombre));
  return cabecera('Clientes','Se añaden solos cuando reservan. Pulsa «Ver ficha» para ver su historial completo, sus gustos y las fotos de cada visita.',`<button class="btn btn-p" data-act="fNuevo">Añadir cliente</button>`)+
  `<div class="filtros"><input class="in" id="f-cq" data-in="pCQ" placeholder="Buscar por nombre o teléfono" value="${esc(P.cq)}" style="max-width:320px"><span class="nota">${l.length} clientes</span></div>
  <div class="tbl-wrap"><table class="t"><thead><tr><th>Cliente</th><th>Teléfono</th><th>Última visita</th><th>Próxima cita</th><th>Visitas</th><th>Gastado</th><th>Faltas</th><th></th></tr></thead><tbody>
  ${l.map(({c,r})=>`<tr><td><b>${esc(c.nombre)}</b></td><td class="num">${esc(c.telefono)}</td><td class="num">${r.ultima?fCorta(r.ultima.fecha):'—'}</td><td class="num">${r.siguiente?fCorta(r.siguiente.fecha)+' '+r.siguiente.inicio:'—'}</td><td class="r">${r.hechas.length}</td><td class="r">${eur(r.gastado)}</td><td class="r">${r.faltas?`<span class="pill e-No-vino">${r.faltas}</span>`:'0'}</td><td class="acc"><button class="btn btn-sm" data-act="fAbrir" data-tel="${esc(tel(c.telefono))}">Ver ficha</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">No hay clientes.</td></tr>'}
  </tbody></table></div>`}

      ${x.notas?`<p class="nota">${esc(x.notas)}</p>`:''}
      ${futura?'':`<div class="fotos">${fs.map(f=>{const m=MINI[f.id];return`<button class="th" data-act="vAbrir" data-id="${esc(f.id)}" aria-label="${esc(f.tipo)}: ${esc(f.nombre)}">${m&&m.url?`<img src="${m.url}" alt="">`:f.tipo==='Vídeo'?'Vídeo':'…'}<span class="tipo">${esc(f.tipo)}</span></button>`}).join('')}
        <button class="subir" data-act="fSubir" data-id="${esc(x.id)}" ${F.subiendo===x.id?'disabled':''}>${F.subiendo===x.id?'Subiendo…':'+ Foto o vídeo'}</button></div>`}</article>`};
  return`<div class="ovl" data-act="fCerrar"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Ficha de ${esc(c.nombre)}">
   <div class="modal-h"><div class="c-logo" aria-hidden="true">${esc((c.nombre||'?')[0])}</div><div style="min-width:0"><h2>${esc(c.nombre)}</h2><span class="muted num">${esc(c.telefono)} · cliente desde ${fCorta(c.desde)}</span></div><button class="x" data-act="fCerrar" aria-label="Cerrar">×</button></div>
   <div class="modal-b">
    <div class="stats s6">
     <div class="stat"><span class="lbl">Última visita</span><b>${r.ultima?fCorta(r.ultima.fecha):'—'}</b><span class="muted">${r.ultima?esc(r.ultima.servicio):'Aún no ha venido'}</span></div>
     <div class="stat"><span class="lbl">Próxima cita</span><b>${r.siguiente?fCorta(r.siguiente.fecha):'—'}</b><span class="muted">${r.siguiente?r.siguiente.inicio+' · '+esc(r.siguiente.servicio):'Sin cita'}</span></div>
     <div class="stat"><span class="lbl">Visitas</span><b>${r.hechas.length}</b><span class="muted">${r.favorito?'Suele pedir: '+esc(r.favorito):'—'}</span></div>
     <div class="stat"><span class="lbl">Total gastado</span><b>${eur(r.gastado)}</b><span class="muted">media ${eur(r.hechas.length?r.gastado/r.hechas.length:0)}</span></div>

     <div class="stat"><span class="lbl">No vino</span><b style="${r.faltas?'color:var(--bad)':''}">${r.faltas}</b><span class="muted">faltas sin avisar</span></div>

    <section><h3>Datos, gustos y preferencias</h3>

       <label class="field"><span>Nombre</span><input class="in" id="fc-nombre" value="${esc(c.nombre)}" maxlength="80"></label>

      <label class="field"><span>Lo que le gusta, colores, alergias a productos, cómo prefiere que la atiendan…</span><textarea class="in" id="fc-notas" rows="3" maxlength="1000">${esc(c.notas)}</textarea></label>
      <div class="acciones"><button class="btn btn-p" type="submit" ${P.ocupado?'disabled':''}>Guardar ficha</button><button type="button" class="btn" data-act="fCita">Nueva cita para este cliente</button></div>
     </form></section>
    <section><h3>Próximas citas</h3>${r.futuras.length?r.futuras.map(x=>visita(x,true)).join(''):'<p class="vacio">No tiene citas pendientes.</p>'}</section>
    <section><h3>Historial de visitas</h3>${r.pasadas.length?r.pasadas.slice().reverse().map(x=>visita(x,false)).join(''):'<p class="vacio">Todavía no hay visitas pasadas.</p>'}
     <p class="nota">Las fotos y vídeos se guardan en la carpeta «Fotos de clientes» de tu Drive, junto a la hoja. Máximo 25 MB por archivo.</p></section>
   </div></div>
   <input type="file" id="f-subir" accept="image/*,video/*" hidden>`}

function cargarMinis(){
  if(!P.ficha||P.ficha.nuevo)return;
  const ids=new Set(S.citas.filter(c=>tel(c.telefono)===P.ficha.tel).map(c=>c.id));
  S.fotos.filter(f=>ids.has(f.cita)&&f.tipo==='Foto'&&!MINI[f.id]).forEach(f=>{
    MINI[f.id]={url:''};
    pc('panelVerFoto',f.id,true).then(r=>{MINI[f.id]=r;if(r.url&&P.ficha)render()}).catch(()=>{})})}

function celda(tb,i,c,r){
  const id=`f-${tb}-${i}-${c.k}`,v=r[c.k]??'',b=`id="${id}" data-tb="${tb}" data-i="${i}" data-k="${c.k}" aria-label="${esc(c.l)}"`,w=c.w?` style="min-width:${c.w}px"`:'';
  if(c.ty==='ro')return`<td class="calc">${esc(v)}</td>`;
  if(c.ty==='calc')return`<td class="calc" data-calc="${tb}-${i}-${c.k}">${esc(c.f(r))}</td>`;
  if(c.ty==='sel'){const ops=c.o();if(v&&!ops.includes(v))ops.push(v);return`<td><select class="in" ${b}${w}>${ops.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${o?esc(o):'Ninguno'}</option>`).join('')}</select></td>`}
  if(c.ty==='area')return`<td><textarea class="in" rows="2" ${b}${w}>${esc(v)}</textarea></td>`;
  if(c.ty==='foto')return`<td><div class="f-svc">${v?`<img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(v)}&sz=w120" alt="">`:''}<button class="btn btn-sm" data-act="pFotoSvc" data-tb="${tb}" data-i="${i}" ${P.ocupado?'disabled':''}>${v?'Cambiar':'Subir foto'}</button>${v?`<button class="btn btn-sm" data-act="pQuitarFotoSvc" data-tb="${tb}" data-i="${i}" ${P.ocupado?'disabled':''}>Quitar</button>`:''}</div></td>`;
  if(c.ty==='color')return`<td><input type="color" ${b} value="${esc(/^#[0-9a-f]{6}$/i.test(v)?v:'#888888')}"></td>`;
  const ty={num:'number',time:'time',date:'date'}[c.ty]||'text';
  return`<td><input class="in" type="${ty}" ${b} value="${esc(v)}"${c.step?` step="${c.step}"`:''}${c.ty==='num'?' min="0" style="width:'+(c.w||80)+'px"':w}${c.ph?` placeholder="${c.ph}"`:''}></td>`}
function vTabla(tb){
  const T=TABLAS[tb],rows=S[tb]||[];
  return cabecera(T.t,T.d,`<button class="btn btn-p" data-act="pAdd" data-tb="${tb}" ${P.ocupado?'disabled':''}>Añadir fila</button>`)+
  `<div class="tbl-wrap"><table class="t"><thead><tr>${T.cols.map(c=>`<th>${c.l}</th>`).join('')}<th></th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr>${T.cols.map(c=>celda(tb,i,c,r)).join('')}<td class="acc">${P.del===tb+i?`<span class="muted">¿Eliminar?</span> <button class="btn btn-sm btn-bad" data-act="pDelSi" data-tb="${tb}" data-i="${i}">Sí</button> <button class="btn btn-sm" data-act="pDelNo">No</button>`:`<button class="btn btn-sm" data-act="pDel" data-tb="${tb}" data-i="${i}">Eliminar</button>`}</td></tr>`).join('')||`<tr><td colspan="${T.cols.length+1}" class="muted">Sin filas. Pulsa «Añadir fila».</td></tr>`}

// Reduce la foto en el móvil antes de subirla (máx. 1200 px, JPG), para que suba rápido y la web cargue ligera.
async function fotoReducida(file,max=1200){const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('No se puede leer esa foto. Prueba con otra o hazle una captura.'));i.src=URL.createObjectURL(file)});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);return c.toDataURL('image/jpeg',.82).split(',')[1]}
